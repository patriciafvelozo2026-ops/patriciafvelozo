    var ordem = dados.categorias;
    itens.sort(function (a, b) {
      return (ordem.indexOf(a.cat) - ordem.indexOf(b.cat)) || a.servico.localeCompare(b.servico, "pt") ||
        a.nome.localeCompare(b.nome, "pt");
    });
    var grupos = [];
    itens.forEach(function (p) {
      var g = grupos[grupos.length - 1];
      if (!g || g.cat !== p.cat) grupos.push(g = { cat: p.cat, itens: [] });
      g.itens.push(p);
    });
    $("lista").innerHTML = grupos.map(function (g) {
      return "<h2>" + esc(g.cat) + " <small>" + g.itens.length + "</small></h2><div class=\"grupo\">" +
        g.itens.map(cartao).join("") + "</div>";
    }).join("");
  }

  function cartao(p) {
    var extras = [];
    if (p.obs) extras.push(esc(p.obs));
    if (p.insta) extras.push("Instagram @" + esc(p.insta));
    if (p.indicado) extras.push("Indicado por " + esc(p.indicado));
    return '<article class="item"><div class="item-topo"><div>' +
      '<div class="servico">' + esc(p.servico) + "</div>" +
      '<div class="nome">' + esc(p.nome) + ' · <span class="numero">' + esc(formatarTel(p.tel)) + "</span></div>" +
      (extras.length ? '<div class="extra">' + extras.join(" · ") + "</div>" : "") +
      '</div><button type="button" class="corrigir" data-id="' + esc(p.id) + '">Corrigir</button></div>' +
      '<div class="acoes"><a class="zap" target="_blank" rel="noopener" href="https://wa.me/55' + esc(p.tel) + '">WhatsApp</a>' +
      '<button type="button" class="copiar" data-tel="' + esc(p.tel) + '">Copiar número</button></div></article>';
  }

  function desenharResto() {
    var n = dados.prestadores.length;
    $("resumo").textContent = n + (n === 1 ? " contato indicado" : " contatos indicados") + " pelos vizinhos.";
    $("rodape").textContent = "Lista atualizada em " + dataCurta(dados.atualizada) + ".";
    $("novo").textContent = modoSugestao() ? "+ Sugerir" : "+ Adicionar";
    $("aviso-leitura").hidden = !modoSugestao();
    $("historico").hidden = !dados.historico.length;
    $("historico-lista").innerHTML = dados.historico.map(function (h) {
      return "<li>" + esc(dataCurta(h.quando)) + ": " + esc(h.acao) + " " + esc(h.resumo) + "</li>";
    }).join("");
  }

  function desenhar() { desenharChips(); desenharLista(); desenharResto(); }

  // ---------- formulário ----------
  var CAMPOS = ["servico", "nome", "tel", "cat", "insta", "obs", "indicado"];

  function abrirForm(p, rascunho) {
    editando = p || null; confirmarRemocao = false; repetidoAceito = false;
    var f = $("form");
    f.reset();
    $("form-titulo").textContent = modoSugestao()
      ? (p ? "Sugerir correção" : "Sugerir prestador")
      : (p ? "Corrigir contato" : "Adicionar prestador");
    $("f-cat").innerHTML = dados.categorias.map(function (c) { return "<option>" + esc(c) + "</option>"; }).join("");
    var servicos = {};
    dados.prestadores.forEach(function (x) { servicos[x.servico] = 1; });
    $("f-servicos").innerHTML = Object.keys(servicos).sort().map(function (s) {
      return '<option value="' + esc(s) + '"></option>';
    }).join("");
    var base = rascunho || p;
    if (base) {
      CAMPOS.forEach(function (c) { f.elements[c].value = base[c] || ""; });
      if (!rascunho) f.elements.tel.value = formatarTel(p.tel);
    }
    if (!base) f.elements.cat.value = estado.filtro !== "Todos" ? estado.filtro : "Outros serviços";
    $("f-salvar").textContent = modoSugestao() ? "Preparar sugestão" : "Salvar";
    $("f-remover").hidden = !p || modoSugestao();
    $("f-remover").textContent = "Remover da lista";
    $("f-nota").hidden = true;
    $("f-erro").hidden = true;
    $("f-botoes").hidden = false;
    $("f-enviar").hidden = true;
    $("dialogo").showModal();
  }

  function lerForm() {
    var f = $("form"), v = {};
    CAMPOS.forEach(function (c) { v[c] = f.elements[c].value.replace(/\s+/g, " ").trim(); });
    v.insta = v.insta.replace(/^@/, "");
    v.tel = limparTel(v.tel);
    if (!v.servico) return { erro: "Escreva o serviço, por exemplo Eletricista." };
    if (!v.nome) return { erro: "Escreva o nome da pessoa ou da empresa." };
    if (v.tel.length < 10 || v.tel.length > 11) return { erro: "Confira o telefone: use DDD e número, como 27 99999-9999." };
    return { valor: v };
  }

  function erroForm(msg) { $("f-erro").textContent = msg; $("f-erro").hidden = !msg; }

  function nota(html) { $("f-nota").innerHTML = html; $("f-nota").hidden = false; }

  function enviarForm() {
    erroForm("");
    var r = lerForm();
    if (r.erro) return erroForm(r.erro);
    var v = r.valor;
    var repetido = dados.prestadores.filter(function (p) {
      return p.tel === v.tel && (!editando || p.id !== editando.id);
    })[0];
    if (repetido && !repetidoAceito) {
      nota("Esse telefone já está na lista: <b>" + esc(repetido.nome) + "</b> (" + esc(repetido.servico) + ").<br>" +
        '<button type="button" id="n-abrir">Corrigir o que já existe</button><button type="button" id="n-seguir">Continuar mesmo assim</button>');
      $("n-abrir").onclick = function () { $("dialogo").close(); abrirForm(repetido); };
      $("n-seguir").onclick = function () { repetidoAceito = true; enviarForm(); };
      return;
    }
    if (modoSugestao()) return prepararSugestao(v);
    if (!ns) return erroForm("A página ainda está carregando. Espere um instante e toque em Salvar de novo.");
    var lista;
    if (editando) {
      lista = dados.prestadores.map(function (p) {
        return p.id === editando.id ? Object.assign({ id: p.id }, v) : p;
      });
      salvar(lista, "corrigiu", v.servico + " – " + v.nome, { id: editando.id, campos: v });
    } else {
      lista = dados.prestadores.concat([Object.assign({ id: novoId() }, v)]);
      salvar(lista, "adicionou", v.servico + " – " + v.nome, { campos: v });
    }
  }

  function prepararSugestao(v) {
    var linhas = [editando ? "*Correção* para a lista de prestadores do Villagio Campo Grande:" : "*Sugestão* para a lista de prestadores do Villagio Campo Grande:"];
    if (editando) linhas.push("Antes: " + editando.servico + " – " + editando.nome + " – " + formatarTel(editando.tel));
    linhas.push("Serviço: " + v.servico, "Nome: " + v.nome, "Telefone: " + formatarTel(v.tel), "Categoria: " + v.cat);
    if (v.insta) linhas.push("Instagram: @" + v.insta);
    if (v.obs) linhas.push("Observação: " + v.obs);
    if (v.indicado) linhas.push("Indicado por: " + v.indicado);
    $("f-link").href = "https://wa.me/?text=" + encodeURIComponent(linhas.join("\n"));
    nota("Pronto. Toque em <b>Abrir no WhatsApp</b> e envie a mensagem no grupo do condomínio. Quem cuida da lista atualiza para todos.");
    $("f-botoes").hidden = true;
    $("f-enviar").hidden = false;
  }

  function salvar(lista, acao, resumo, rascunho) {
    var token = novoId() + novoId();
    var agora = new Date().toISOString();
    var proximo = {
      rev: (dados.rev || 0) + 1, atualizada: agora, ultimaEdicao: token,
      categorias: dados.categorias, prestadores: lista,
      historico: [{ quando: agora, acao: acao, resumo: resumo }].concat(dados.historico).slice(0, 30)
    };
    sessao(CHAVE_RASCUNHO, JSON.stringify({ token: token, rascunho: rascunho }));
    $("f-salvar").disabled = true; $("f-remover").disabled = true;
    $("f-salvar").textContent = "Salvando…";
    ns.publish(documento(proximo)).catch(function (e) {
      var code = e && e.code;
      $("f-salvar").disabled = false; $("f-remover").disabled = false;
      $("f-salvar").textContent = "Salvar";
      if (code === "conflict") {
        nota("Outra pessoa salvou a lista agora mesmo. A página vai recarregar com a versão nova e o que você escreveu volta para você salvar de novo.");
        return;
      }
      sessao(CHAVE_RASCUNHO, null);
      if (["not_writer", "not_granted", "not_declared", "consent_required", "capability_disabled", "capability_removed"].indexOf(code) >= 0) {
        podeSalvar = false;
        desenharResto();
        $("f-salvar").textContent = "Preparar sugestão";
        $("f-remover").hidden = true;
        nota("Você pode ver a lista, mas não pode salvar alterações daqui. Toque em <b>Preparar sugestão</b> para mandar pelo WhatsApp.");
      } else if (code === "rate_limited") {
        erroForm("Muitas alterações seguidas. Espere um minuto e toque em Salvar de novo.");
      } else if (code === "too_large") {
        erroForm("A lista ficou grande demais para salvar. Avise quem cuida da lista.");
      } else {
        erroForm("Não foi possível salvar agora. Confira a internet e toque em Salvar de novo.");
      }
    });
  }

  // Monta a página inteira de novo, com a lista nova embutida.
  function documento(d) {
    var json = JSON.stringify(d).replace(/</g, "\\u003c");
    return INICIO_DOC +
      "<title>Prestadores Villagio Campo Grande</title>\n" +
      document.querySelector('link[href*="fonts.googleapis.com"]').outerHTML + "\n" +
      $("estilo").outerHTML + "\n" +
      $("molde").outerHTML + "\n" +
      '<div id="raiz"></div>\n' +
      '<script type="application/json" id="dados">' + json + "<\/script>\n" +
      $("app").outerHTML + FIM_DOC;
  }

  // ---------- eventos ----------
  $("busca").addEventListener("input", function (e) { estado.busca = e.target.value; desenharLista(); });
  $("chips").addEventListener("click", function (e) {
    var b = e.target.closest(".chip");
    if (!b) return;
    estado.filtro = b.getAttribute("data-cat");
    desenharChips(); desenharLista();
  });
  $("lista").addEventListener("click", function (e) {
    var c = e.target.closest(".corrigir");
    if (c) {
      var id = c.getAttribute("data-id");
      return abrirForm(dados.prestadores.filter(function (p) { return p.id === id; })[0]);
    }
    var b = e.target.closest(".copiar");
    if (!b) return;
    var tel = b.getAttribute("data-tel");
    var ok = function () { b.textContent = "Copiado"; setTimeout(function () { b.textContent = "Copiar número"; }, 1800); };
    var manual = function () {
      var n = b.closest(".item").querySelector(".numero");
      var sel = window.getSelection(), r = document.createRange();
      r.selectNodeContents(n); sel.removeAllRanges(); sel.addRange(r);
      toast("Número selecionado. Use Copiar do seu celular.");
    };
    try { navigator.clipboard.writeText(tel).then(ok, manual); } catch (err) { manual(); }
  });
  $("novo").addEventListener("click", function () { abrirForm(null); });
  $("f-cancelar").addEventListener("click", function () { $("dialogo").close(); });
  $("f-voltar").addEventListener("click", function () {
    $("f-botoes").hidden = false; $("f-enviar").hidden = true; $("f-nota").hidden = true;
  });
  $("f-link").addEventListener("click", function () {
    setTimeout(function () { $("dialogo").close(); toast("Obrigado! Agora é só enviar no grupo."); }, 300);
  });
  $("form").addEventListener("submit", function (e) { e.preventDefault(); enviarForm(); });
  $("f-remover").addEventListener("click", function () {
    if (!confirmarRemocao) {
      confirmarRemocao = true;
      $("f-remover").textContent = "Toque de novo para confirmar a remoção";
      return;
    }
    var alvo = editando;
    salvar(dados.prestadores.filter(function (p) { return p.id !== alvo.id; }),
      "removeu", alvo.servico + " – " + alvo.nome, { id: alvo.id, remover: true });
  });

  // ---------- início ----------
  desenhar();

  var guardado = sessao(CHAVE_RASCUNHO);
  if (guardado) {
    sessao(CHAVE_RASCUNHO, null);
    try {
      var r = JSON.parse(guardado);
      if (r.token === dados.ultimaEdicao) {
        toast("Salvo. Obrigado por ajudar!");
      } else if (r.rascunho && !r.rascunho.remover) {
        var alvo = dados.prestadores.filter(function (p) { return p.id === r.rascunho.id; })[0];
        if (!r.rascunho.id || alvo) {
          abrirForm(alvo || null, r.rascunho.campos);
          nota("Outra pessoa salvou a lista enquanto você editava. Confira os dados e toque em Salvar de novo.");
        }
      }
    } catch (e) {}
  }

  if (temViewer) {
    claude.use("artifact").then(function (a) {
      ns = a;
      if (!a) { podeSalvar = false; desenharResto(); return; }
      return claude.use("user").then(function (u) {
        if (!u) return;
        return u.canEdit().then(function (v) { podeSalvar = v; desenharResto(); });
      });
    }).catch(function () { podeSalvar = false; desenharResto(); });
  }
})();
</script>
