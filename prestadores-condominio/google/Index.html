<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prestadores Villagio Campo Grande</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;display=swap">
<style>
/* Layout: cabeçalho com busca fixa no topo, lista agrupada por categoria, botão de adicionar flutuante. */
:root {
  --fundo: #eef2f4; --cartao: #ffffff; --tinta: #142128; --suave: #55666f; --linha: #d5dde1;
  --acento: #1d5c8c; --acento-tinta: #ffffff; --acento-claro: #dce8f2;
  --zap: #12804a; --zap-tinta: #ffffff; --perigo: #b42318; --aviso: #fbefcf; --sombra: rgba(20, 33, 40, .18);
  --f-titulo: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-texto: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fundo: #0f171c; --cartao: #172229; --tinta: #e6edf0; --suave: #9fb1ba; --linha: #28363e;
    --acento: #82b8e4; --acento-tinta: #0b1419; --acento-claro: #1c3447;
    --zap: #34c172; --zap-tinta: #04210f; --perigo: #f4978e; --aviso: #3a3116; --sombra: rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fundo: #0f171c; --cartao: #172229; --tinta: #e6edf0; --suave: #9fb1ba; --linha: #28363e;
  --acento: #82b8e4; --acento-tinta: #0b1419; --acento-claro: #1c3447;
  --zap: #34c172; --zap-tinta: #04210f; --perigo: #f4978e; --aviso: #3a3116; --sombra: rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
body { background: var(--fundo); color: var(--tinta); font: 16px/1.45 var(--f-texto); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }
.pagina { max-width: 1100px; margin: 0 auto; padding: 0 16px 120px; }
.cabeca { padding-block: 22px 6px; }
h1 { font-family: var(--f-titulo); font-weight: 800; font-size: clamp(26px, 7vw, 36px); line-height: 1.05;
  letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.marca { display: inline-flex; background: #fffdf8; border: 1px solid var(--linha); border-radius: 12px;
  padding: 6px 12px; margin-bottom: 14px; }
.marca img { display: block; height: 64px; width: auto; max-width: 100%; }
.selo { margin: 0 0 6px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--acento); }
.linha-fina { color: var(--suave); margin: 6px 0 0; font-size: 15px; }
.barra { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--fundo);
  padding-block: 10px 8px; border-bottom: 1px solid var(--linha); }
.busca { width: 100%; padding: 12px 14px; border: 1px solid var(--linha); border-radius: 12px;
  background: var(--cartao); font-size: 17px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-top: 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: flex; gap: 6px; align-items: baseline; border: 1px solid var(--linha);
  background: var(--cartao); border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
.chip span { color: var(--suave); font-variant-numeric: tabular-nums; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--acento); border-color: var(--acento); color: var(--acento-tinta); }
.chip[aria-pressed="true"] span { color: inherit; opacity: .8; }
.desfazer { margin-left: 6px; border: 1px solid var(--linha); background: var(--cartao); color: var(--tinta);
  border-radius: 8px; padding: 2px 8px; font-size: 13px; cursor: pointer; }
.aviso-leitura { background: var(--acento-claro); border-radius: 12px; padding: 10px 14px; margin-top: 14px;
  font-size: 15px; }
h2 { font-family: var(--f-titulo); font-weight: 600; font-size: 19px; margin: 26px 0 10px;
  display: flex; gap: 8px; align-items: baseline; }
h2 small { font-family: var(--f-texto); font-weight: 400; font-size: 14px; color: var(--suave); }
.grupo { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
.item { background: var(--cartao); border: 1px solid var(--linha); border-radius: 14px; padding: 14px;
  display: grid; gap: 10px; }
.item-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.item-topo > div { min-width: 0; }
.servico { font-weight: 700; font-size: 17px; overflow-wrap: anywhere; }
.nome { overflow-wrap: anywhere; }
.numero { font-variant-numeric: tabular-nums; color: var(--suave); white-space: nowrap; user-select: all; }
.extra { color: var(--suave); font-size: 14px; overflow-wrap: anywhere; }
.corrigir { flex: none; border: 0; background: none; color: var(--suave); text-decoration: underline;
  font-size: 14px; padding: 2px 4px; cursor: pointer; }
.acoes { display: flex; gap: 8px; }
.acoes > * { flex: 1; text-align: center; border-radius: 10px; padding: 9px 8px; font-weight: 700;
  font-size: 15px; text-decoration: none; cursor: pointer; border: 0; }
.zap { background: var(--zap); color: var(--zap-tinta); }
.copiar { background: var(--acento-claro); color: var(--tinta); }
.vazio { text-align: center; color: var(--suave); padding: 40px 10px; }
.historico { margin-top: 34px; color: var(--suave); font-size: 14px; }
.historico summary { cursor: pointer; }
.historico ol { padding-left: 18px; margin: 8px 0 0; display: grid; gap: 4px; }
.rodape { margin-top: 18px; color: var(--suave); font-size: 13px; }
.novo { position: fixed; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 3;
  border: 0; border-radius: 999px; background: var(--acento); color: var(--acento-tinta);
  padding: 15px 22px; font-weight: 700; font-size: 17px; box-shadow: 0 6px 18px var(--sombra); cursor: pointer; }
dialog { width: min(560px, calc(100% - 24px)); max-height: calc(100% - 24px); border: 0; padding: 0;
  border-radius: 18px; background: var(--cartao); color: var(--tinta); }
dialog::backdrop { background: rgba(8, 14, 18, .5); }
form { padding: 20px 18px 16px; display: grid; gap: 4px; }
form h3 { font-family: var(--f-titulo); font-weight: 800; font-size: 22px; margin: 0 0 8px; }
label { font-weight: 700; font-size: 14px; margin-top: 8px; }
label small { font-weight: 400; color: var(--suave); }
input, select { width: 100%; padding: 11px 12px; border: 1px solid var(--linha); border-radius: 10px;
  background: var(--fundo); font-size: 16px; }
.nota { border-radius: 10px; padding: 10px 12px; margin-top: 10px; font-size: 14px; background: var(--aviso); }
.nota button { margin-top: 8px; margin-right: 6px; border: 1px solid var(--linha); background: var(--cartao);
  border-radius: 8px; padding: 7px 10px; font-size: 14px; cursor: pointer; }
.erro { color: var(--perigo); font-size: 14px; margin: 8px 0 0; }
.botoes { display: flex; gap: 8px; margin-top: 14px; }
.botoes > * { flex: 1; border-radius: 10px; padding: 12px; font-weight: 700; border: 0; cursor: pointer;
  text-align: center; text-decoration: none; }
.principal { background: var(--acento); color: var(--acento-tinta); }
.secundario { background: var(--fundo); border: 1px solid var(--linha) !important; }
.remover { border: 0; background: none; color: var(--perigo); padding: 10px; margin-top: 4px; cursor: pointer; }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); z-index: 4;
  transform: translateX(-50%); background: var(--tinta); color: var(--fundo); border-radius: 10px;
  padding: 10px 16px; max-width: calc(100% - 32px); opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
@media (min-width: 760px) {
  .cabeca { display: grid; grid-template-columns: 1fr auto; column-gap: 28px; align-items: center; padding-block: 28px 10px; }
  .cabeca > .marca { grid-column: 2; grid-row: 1 / span 3; margin: 0; }
  .cabeca > :not(.marca) { grid-column: 1; }
  .marca img { height: 84px; }
  .chips { flex-wrap: wrap; overflow: visible; }
  .item { align-content: space-between; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
  <div class="pagina">
    <header class="cabeca">
      <?!= logo() ?>
      <p class="selo">Villagio Campo Grande Residencial</p>
      <h1>Prestadores de serviço</h1>
      <p class="linha-fina" id="resumo">Indicações dos vizinhos, num lugar só.</p>
    </header>
    <div class="barra">
      <input class="busca" id="busca" type="search" placeholder="Buscar: eletricista, salgado, Salomão…" autocomplete="off" aria-label="Buscar prestador">
      <div class="chips" id="chips" role="toolbar" aria-label="Categorias"></div>
    </div>
    <main id="lista"></main>
    <details class="historico" id="historico" hidden>
      <summary>Últimas alterações</summary>
      <ol id="historico-lista"></ol>
    </details>
    <p class="rodape"><span id="rodape"></span> Página criada por Patrícia Velozo Consultoria &amp; IA.</p>
  </div>
  <button class="novo" id="novo" type="button">+ Adicionar</button>
  <dialog id="dialogo" aria-labelledby="form-titulo">
    <form id="form" novalidate>
      <h3 id="form-titulo">Adicionar prestador</h3>
      <label for="f-servico">Serviço</label>
      <input id="f-servico" name="servico" list="f-servicos" placeholder="Ex.: Eletricista" maxlength="120">
      <datalist id="f-servicos"></datalist>
      <label for="f-nome">Nome</label>
      <input id="f-nome" name="nome" placeholder="Pessoa ou empresa" maxlength="80">
      <label for="f-tel">Telefone / WhatsApp</label>
      <input id="f-tel" name="tel" type="tel" inputmode="tel" placeholder="27 99999-9999" maxlength="25">
      <label for="f-cat">Categoria</label>
      <select id="f-cat" name="cat"></select>
      <label for="f-insta">Instagram <small>(opcional)</small></label>
      <input id="f-insta" name="insta" placeholder="@perfil" maxlength="60">
      <label for="f-obs">Observação <small>(opcional)</small></label>
      <input id="f-obs" name="obs" placeholder="Ex.: por encomenda, atende 24h" maxlength="160">
      <label for="f-indicado">Indicado por <small>(opcional, só a torre e o apartamento)</small></label>
      <input id="f-indicado" name="indicado" placeholder="Ex.: Esmeralda 1001" maxlength="40">
      <div id="campo-codigo" hidden>
        <label for="f-codigo">Palavra do condomínio <small>(combinada no grupo)</small></label>
        <input id="f-codigo" name="codigo" autocomplete="off">
      </div>
      <div class="nota" id="f-nota" hidden></div>
      <p class="erro" id="f-erro" role="alert" hidden></p>
      <div class="botoes" id="f-botoes">
        <button type="button" class="secundario" id="f-cancelar">Cancelar</button>
        <button type="submit" class="principal" id="f-salvar">Salvar</button>
      </div>
      <button type="button" class="remover" id="f-remover" hidden>Remover da lista</button>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var CACHE = "prestadores-villagio-v1", CHAVE_CODIGO = "prestadores-villagio-codigo";
  var dados = { prestadores: [], categorias: [], historico: [], atualizada: "", pedeCodigo: false };
  var estado = { filtro: "Todos", busca: "" };
  var editando = null, confirmarRemocao = false, repetidoAceito = false, carregou = false;

  function guardar(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function ler(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function servidor(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (ok, falha) {
      if (!(window.google && google.script && google.script.run)) return falha(new Error("Sem conexão com o servidor."));
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(falha);
      r[fn].apply(r, args);
    });
  }
  function msgErro(e) { return String((e && e.message) || e || "").replace(/^Error:\s*/, ""); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function semAcento(s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
  function formatarTel(t) {
    t = String(t || "");
    if (t.length === 11) return "(" + t.slice(0, 2) + ") " + t.slice(2, 7) + "-" + t.slice(7);
    if (t.length === 10) return "(" + t.slice(0, 2) + ") " + t.slice(2, 6) + "-" + t.slice(6);
    return t;
  }
  function dataCurta(iso) {
    var d = new Date(iso);
    return isNaN(d) ? "" : d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
  }
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg; t.classList.add("on");
    clearTimeout(toast.t);
    toast.t = setTimeout(function () { t.classList.remove("on"); }, 3000);
  }

  function aplicar(d) {
    dados = d;
    carregou = true;
    guardar(CACHE, JSON.stringify(d));
    desenhar();
  }

  // ---------- lista ----------
  function desenharChips() {
    var cont = {};
    dados.prestadores.forEach(function (p) { cont[p.cat] = (cont[p.cat] || 0) + 1; });
    var cats = ["Todos"].concat(dados.categorias.filter(function (c) { return cont[c]; }));
    if (cats.indexOf(estado.filtro) < 0) estado.filtro = "Todos";
    $("chips").innerHTML = cats.map(function (c) {
      var n = c === "Todos" ? dados.prestadores.length : cont[c];
      return '<button type="button" class="chip" aria-pressed="' + (c === estado.filtro) + '" data-cat="' + esc(c) + '">' +
        esc(c) + " <span>" + n + "</span></button>";
    }).join("");
  }

  function desenharLista() {
    if (!carregou) { $("lista").innerHTML = '<p class="vazio">Carregando a lista…</p>'; return; }
    var termos = semAcento(estado.busca).split(/\s+/).filter(Boolean);
    var buscaTel = estado.busca.replace(/\D/g, "");
    var itens = dados.prestadores.filter(function (p) {
      if (estado.filtro !== "Todos" && p.cat !== estado.filtro) return false;
      var texto = semAcento([p.servico, p.nome, p.cat, p.obs, p.insta, p.indicado].join(" "));
      return termos.every(function (t) { return texto.indexOf(t) >= 0 || (buscaTel.length >= 4 && p.tel.indexOf(buscaTel) >= 0); });
    });
    if (!itens.length) {
      $("lista").innerHTML = '<p class="vazio">' + (dados.prestadores.length
        ? "Ninguém encontrado com essa busca.<br>Conhece alguém bom? Toque em <b>+ Adicionar</b>."
        : "A lista ainda está vazia. Toque em <b>+ Adicionar</b> para incluir o primeiro prestador.") + "</p>";
      return;
    }
    var ordem = dados.categorias;
    itens.sort(function (a, b) {
      return (ordem.indexOf(a.cat) - ordem.indexOf(b.cat)) || a.servico.localeCompare(b.servico, "pt") ||
        a.nome.localeCompare(b.nome, "pt");
    });
    var grupos = [];
    itens.forEach(function (p) {
      var g = grupos[grupos.length - 1];
      if (!g || g.cat !== p.cat) grupos.push(g = { cat: p.cat, itens: [] });
      g.itens.push(p);
    });
    $("lista").innerHTML = grupos.map(function (g) {
      return "<h2>" + esc(g.cat) + " <small>" + g.itens.length + "</small></h2><div class=\"grupo\">" +
        g.itens.map(cartao).join("") + "</div>";
    }).join("");
  }

  function cartao(p) {
    var extras = [];
    if (p.obs) extras.push(esc(p.obs));
    if (p.insta) extras.push("Instagram @" + esc(p.insta));
    if (p.indicado) extras.push("Indicado por " + esc(p.indicado));
    return '<article class="item"><div class="item-topo"><div>' +
      '<div class="servico">' + esc(p.servico) + "</div>" +
      '<div class="nome">' + esc(p.nome) + ' · <span class="numero">' + esc(formatarTel(p.tel)) + "</span></div>" +
      (extras.length ? '<div class="extra">' + extras.join(" · ") + "</div>" : "") +
      '</div><button type="button" class="corrigir" data-id="' + esc(p.id) + '">Corrigir</button></div>' +
      '<div class="acoes"><a class="zap" target="_blank" rel="noopener" href="https://wa.me/55' + esc(p.tel) + '">WhatsApp</a>' +
      '<button type="button" class="copiar" data-tel="' + esc(p.tel) + '">Copiar número</button></div></article>';
  }

  function desenharResto() {
    var n = dados.prestadores.length;
    $("resumo").textContent = carregou
      ? n + (n === 1 ? " contato indicado" : " contatos indicados") + " pelos vizinhos. Qualquer vizinho pode adicionar ou corrigir."
      : "Indicações dos vizinhos, num lugar só.";
    $("rodape").textContent = dados.atualizada ? "Lista atualizada em " + dataCurta(dados.atualizada) + "." : "";
    $("historico").hidden = !dados.historico.length;
    $("historico-lista").innerHTML = dados.historico.map(function (h) {
      var desfazer = h.antes ? ' <button type="button" class="desfazer" data-hid="' + esc(h.hid) + '">' +
        (h.acao === "removeu" ? "Restaurar" : "Desfazer") + "</button>" : "";
      return "<li>" + esc(dataCurta(h.quando)) + ": " + esc(h.acao) + " " + esc(h.resumo) + desfazer + "</li>";
    }).join("");
  }

  function desenhar() { desenharChips(); desenharLista(); desenharResto(); }

  // ---------- formulário ----------
  var CAMPOS = ["servico", "nome", "tel", "cat", "insta", "obs", "indicado"];

  function abrirForm(p) {
    editando = p || null; confirmarRemocao = false; repetidoAceito = false;
    var f = $("form");
    f.reset();
    $("form-titulo").textContent = p ? "Corrigir contato" : "Adicionar prestador";
    $("f-cat").innerHTML = dados.categorias.map(function (c) { return "<option>" + esc(c) + "</option>"; }).join("");
    var servicos = {};
    dados.prestadores.forEach(function (x) { servicos[x.servico] = 1; });
    $("f-servicos").innerHTML = Object.keys(servicos).sort().map(function (s) {
      return '<option value="' + esc(s) + '"></option>';
    }).join("");
    if (p) {
      CAMPOS.forEach(function (c) { f.elements[c].value = p[c] || ""; });
      f.elements.tel.value = formatarTel(p.tel);
    } else {
      f.elements.cat.value = estado.filtro !== "Todos" ? estado.filtro : "Outros serviços";
    }
    $("campo-codigo").hidden = !(dados.pedeCodigo && !ler(CHAVE_CODIGO));
    $("f-remover").hidden = !p;
    $("f-remover").textContent = "Remover da lista";
    $("f-nota").hidden = true;
    $("f-erro").hidden = true;
    $("dialogo").showModal();
  }

  function erroForm(msg) { $("f-erro").textContent = msg; $("f-erro").hidden = !msg; }
  function nota(html) { $("f-nota").innerHTML = html; $("f-nota").hidden = false; }
  function ocupado(sim, texto) {
    $("f-salvar").disabled = sim; $("f-remover").disabled = sim;
    $("f-salvar").textContent = sim ? texto : "Salvar";
  }

  function enviar(op, mensagemOk) {
    var codigo = $("f-codigo").value.trim() || ler(CHAVE_CODIGO) || "";
    erroForm("");
    ocupado(true, "Salvando…");
    return servidor("salvar", op, codigo).then(function (r) {
      ocupado(false);
      if (r && r.repetido) {
        var x = r.repetido;
        nota("Esse telefone já está na lista: <b>" + esc(x.nome) + "</b> (" + esc(x.servico) + ").<br>" +
          '<button type="button" id="n-abrir">Corrigir o que já existe</button><button type="button" id="n-seguir">Salvar mesmo assim</button>');
        $("n-abrir").onclick = function () { $("dialogo").close(); abrirForm(x); };
        $("n-seguir").onclick = function () { op.confirmarRepetido = true; enviar(op, mensagemOk); };
        return;
      }
      if (codigo) guardar(CHAVE_CODIGO, codigo);
      aplicar(r);
      if ($("dialogo").open) $("dialogo").close();
      toast(mensagemOk);
    }).catch(function (e) {
      ocupado(false);
      var msg = msgErro(e);
      if (/palavra do condom/i.test(msg)) { guardar(CHAVE_CODIGO, null); $("campo-codigo").hidden = false; }
      if (!$("dialogo").open) return toast(msg || "Não foi possível salvar. Tente de novo.");
      erroForm(msg || "Não foi possível salvar. Confira a internet e tente de novo.");
      if (/removido por outra pessoa/i.test(msg)) atualizar();
    });
  }

  function lerForm() {
    var f = $("form"), v = {};
    CAMPOS.forEach(function (c) { v[c] = f.elements[c].value.replace(/\s+/g, " ").trim(); });
    var tel = v.tel.replace(/\D/g, "");
    if (!v.servico) return { erro: "Escreva o serviço, por exemplo Eletricista." };
    if (!v.nome) return { erro: "Escreva o nome da pessoa ou da empresa." };
    if (tel.length < 8) return { erro: "Confira o telefone: use DDD e número, como 27 99999-9999." };
    if (dados.pedeCodigo && !ler(CHAVE_CODIGO) && !$("f-codigo").value.trim()) return { erro: "Escreva a palavra do condomínio (combinada no grupo)." };
    return { valor: v };
  }

  function atualizar() {
    return servidor("listar").then(aplicar).catch(function () {
      if (!carregou) {
        $("lista").innerHTML = '<p class="vazio">Não consegui carregar a lista. Confira a internet e abra o link de novo.</p>';
      } else {
        toast("Sem internet: mostrando a última lista que você abriu.");
      }
    });
  }

  // ---------- eventos ----------
  $("busca").addEventListener("input", function (e) { estado.busca = e.target.value; desenharLista(); });
  $("chips").addEventListener("click", function (e) {
    var b = e.target.closest(".chip");
    if (!b) return;
    estado.filtro = b.getAttribute("data-cat");
    desenharChips(); desenharLista();
  });
  $("lista").addEventListener("click", function (e) {
    var c = e.target.closest(".corrigir");
    if (c) {
      var id = c.getAttribute("data-id");
      return abrirForm(dados.prestadores.filter(function (p) { return p.id === id; })[0]);
    }
    var b = e.target.closest(".copiar");
    if (!b) return;
    var tel = b.getAttribute("data-tel");
    var ok = function () { b.textContent = "Copiado"; setTimeout(function () { b.textContent = "Copiar número"; }, 1800); };
    var manual = function () {
      var n = b.closest(".item").querySelector(".numero");
      var sel = window.getSelection(), r = document.createRange();
      r.selectNodeContents(n); sel.removeAllRanges(); sel.addRange(r);
      toast("Número selecionado. Use Copiar do seu celular.");
    };
    try { navigator.clipboard.writeText(tel).then(ok, manual); } catch (err) { manual(); }
  });
  $("historico-lista").addEventListener("click", function (e) {
    var b = e.target.closest(".desfazer");
    if (!b) return;
    b.disabled = true;
    enviar({ acao: "restaurar", hid: b.getAttribute("data-hid") }, "Pronto, voltou para a lista.");
  });
  $("novo").addEventListener("click", function () { abrirForm(null); });
  $("f-cancelar").addEventListener("click", function () { $("dialogo").close(); });
  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var r = lerForm();
    if (r.erro) return erroForm(r.erro);
    if (editando) {
      r.valor.id = editando.id;
      enviar({ acao: "corrigir", item: r.valor }, "Corrigido. Obrigado por ajudar!");
    } else {
      enviar({ acao: "adicionar", item: r.valor }, "Adicionado. Obrigado por ajudar!");
    }
  });
  $("f-remover").addEventListener("click", function () {
    if (!confirmarRemocao) {
      confirmarRemocao = true;
      $("f-remover").textContent = "Toque de novo para confirmar a remoção";
      return;
    }
    enviar({ acao: "remover", id: editando.id }, "Removido. Dá para restaurar em Últimas alterações.");
  });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && carregou && !$("dialogo").open) atualizar();
  });

  // ---------- início ----------
  var guardado = ler(CACHE);
  if (guardado) { try { dados = JSON.parse(guardado); carregou = true; } catch (e) {} }
  desenhar();
  atualizar();
})();
</script>
</body>
</html>
